<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" width="560" height="200" role="img" aria-label="Bookmark env group expanded into Local, Dev, Test, Prod variants">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F1218"/>
      <stop offset="1" stop-color="#0A0C12"/>
    </linearGradient>
  </defs>
  <rect width="560" height="200" rx="14" fill="url(#panel)"/>

  <!-- breadcrumb header -->
  <rect x="0" y="0" width="560" height="32" rx="14" fill="#FFFFFF" fill-opacity="0.04"/>
  <text x="18" y="20" font-family="-apple-system, system-ui" font-size="12" fill="#FFFFFF" fill-opacity="0.55">‹ Hexagon Admin</text>
  <text x="540" y="20" text-anchor="end" font-family="-apple-system, system-ui" font-size="10" fill="#FFFFFF" fill-opacity="0.45">← to go back</text>

  <!-- rows -->
  <g font-family="-apple-system, system-ui">
    <!-- Local -->
    <rect x="0" y="32" width="560" height="42" fill="transparent"/>
    <rect x="18" y="37" width="32" height="32" rx="7" fill="#FFFFFF" fill-opacity="0.10"/>
    <text x="34" y="58" text-anchor="middle" font-size="14" fill="#FFFFFF" fill-opacity="0.9">🏠</text>
    <text x="60" y="58" font-size="15" fill="#FFFFFF">Local</text>
    <text x="540" y="59" text-anchor="end" font-size="11" fill="#FFFFFF" fill-opacity="0.55">localhost:5173/admin</text>

    <!-- Dev (selected) -->
    <rect x="0" y="74" width="560" height="42" fill="#5BAFFF" fill-opacity="0.35"/>
    <rect x="18" y="79" width="32" height="32" rx="7" fill="#FFFFFF" fill-opacity="0.10"/>
    <text x="34" y="100" text-anchor="middle" font-size="14" fill="#FFFFFF" fill-opacity="0.9">🛠</text>
    <text x="60" y="100" font-size="15" fill="#FFFFFF">Dev</text>
    <text x="540" y="101" text-anchor="end" font-size="11" fill="#FFFFFF" fill-opacity="0.7">admin.dev.example.com</text>

    <!-- Test -->
    <rect x="0" y="116" width="560" height="42" fill="transparent"/>
    <rect x="18" y="121" width="32" height="32" rx="7" fill="#FFFFFF" fill-opacity="0.10"/>
    <text x="34" y="142" text-anchor="middle" font-size="14" fill="#FFFFFF" fill-opacity="0.9">🧪</text>
    <text x="60" y="142" font-size="15" fill="#FFFFFF">Test</text>
    <text x="540" y="143" text-anchor="end" font-size="11" fill="#FFFFFF" fill-opacity="0.55">admin.test.example.com</text>

    <!-- Prod -->
    <rect x="0" y="158" width="560" height="42" fill="transparent"/>
    <rect x="18" y="163" width="32" height="32" rx="7" fill="#FFFFFF" fill-opacity="0.10"/>
    <text x="34" y="184" text-anchor="middle" font-size="14" fill="#FFFFFF" fill-opacity="0.9">🚀</text>
    <text x="60" y="184" font-size="15" fill="#FFFFFF">Prod</text>
    <text x="540" y="185" text-anchor="end" font-size="11" fill="#FFFFFF" fill-opacity="0.55">admin.example.com</text>
  </g>
</svg>
