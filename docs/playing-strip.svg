<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 44" width="560" height="44" role="img" aria-label="Now-playing strip: visualizer bars, PLAYING label, headphone pill, Firefox and Microsoft Teams source pills">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F1218"/>
      <stop offset="1" stop-color="#0A0C12"/>
    </linearGradient>
  </defs>
  <rect width="560" height="44" rx="8" fill="url(#bg)"/>
  <rect x="0" y="0" width="560" height="0.5" fill="#FFFFFF" fill-opacity="0.12"/>

  <!-- visualizer bars -->
  <g fill="#5BEC8C">
    <rect x="20" y="20" width="2.2" height="6" rx="1.1"/>
    <rect x="24.5" y="17" width="2.2" height="12" rx="1.1"/>
    <rect x="29" y="14" width="2.2" height="18" rx="1.1"/>
    <rect x="33.5" y="11" width="2.2" height="24" rx="1.1"/>
    <rect x="38" y="14" width="2.2" height="18" rx="1.1"/>
    <rect x="42.5" y="18" width="2.2" height="10" rx="1.1"/>
    <rect x="47" y="15" width="2.2" height="16" rx="1.1"/>
    <rect x="51.5" y="13" width="2.2" height="20" rx="1.1"/>
    <rect x="56" y="16" width="2.2" height="14" rx="1.1"/>
    <rect x="60.5" y="19" width="2.2" height="8" rx="1.1"/>
  </g>

  <!-- PLAYING label -->
  <text x="72" y="27" font-family="ui-monospace, Menlo, monospace" font-size="9.5" font-weight="600" letter-spacing="1.8" fill="#FFFFFF" fill-opacity="0.5">PLAYING</text>

  <!-- headphones pill (Bose) -->
  <rect x="130" y="14" width="62" height="18" rx="6" fill="#FFFFFF" fill-opacity="0.06"/>
  <text x="139" y="26" font-family="-apple-system, system-ui" font-size="11.5" font-weight="500" fill="#FFFFFF" fill-opacity="0.92">🎧 Bose</text>

  <!-- Firefox pill -->
  <rect x="200" y="14" width="76" height="18" rx="6" fill="#FFFFFF" fill-opacity="0.06"/>
  <circle cx="211" cy="23" r="6" fill="#FF7139"/>
  <text x="221" y="26" font-family="-apple-system, system-ui" font-size="11.5" font-weight="500" fill="#FFFFFF" fill-opacity="0.92">Firefox</text>

  <!-- Teams pill -->
  <rect x="284" y="14" width="118" height="18" rx="6" fill="#FFFFFF" fill-opacity="0.06"/>
  <rect x="290" y="17" width="12" height="12" rx="2" fill="#5059C9"/>
  <text x="294" y="26" font-family="-apple-system, system-ui" font-size="9" font-weight="700" fill="#FFFFFF">T</text>
  <text x="307" y="26" font-family="-apple-system, system-ui" font-size="11.5" font-weight="500" fill="#FFFFFF" fill-opacity="0.92">Microsoft Teams</text>
</svg>
